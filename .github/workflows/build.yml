name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file exe
        run: dotnet publish src/Pconnect.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pconnect-win-x64
          path: dist/Pconnect.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pconnect.exe
          generate_release_notes: true

name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish exe
        run: dotnet publish src/Pconnect.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Pconnect.iss'

      - name: Sign binaries (if certificate is provided)
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          if ($env:CERT_PFX) {
            $bytes = [Convert]::FromBase64String($env:CERT_PFX)
            [IO.File]::WriteAllBytes("cert.pfx", $bytes)
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if ($signtool) {
              Get-ChildItem "dist" -Filter *.exe | ForEach-Object {
                & $signtool sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              }
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pconnect
          path: |
            dist/Pconnect.exe
            dist/Pconnect-Setup-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Pconnect.exe
            dist/Pconnect-Setup-*.exe
          generate_release_notes: true
